name: release

# 推送 vX.Y.Z 形式的 tag 时自动跑 GoReleaser，
# 产出多平台二进制并上传到 GitHub Releases。
# 资产命名由 .goreleaser.yaml 控制，必须与 npm/install.js 的 PLATFORM_MAP 对齐。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 release & 上传资产

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser 需要完整历史来生成 changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
